        <!-- Series Detail View -->
        <section id="view-detail" class="view hidden">
            <div class="view-header">
                <button class="btn btn-icon" onclick="app.navigateTo('/')">
                    <i data-feather="arrow-left"></i> Quay lại
                </button>
                <h2 id="detail-series-title">Tên Series</h2>
                <div class="view-actions" style="display:flex; align-items:center; gap:0.5rem;">
                    <span id="detail-volume-count" class="badge">0 tập</span>
                    <div class="custom-select-container" style="position: relative;">
                        <button class="custom-select-btn" id="btn-edit-status" onclick="app.toggleCustomDropdown('status-dropdown')" title="Đổi trạng thái cá nhân" style="display: flex;">
                            <i data-feather="activity" style="color:var(--text-muted); width: 16px; height: 16px;"></i>
                            <span id="btn-status-text" style="font-size:0.85rem; font-weight: 500;">Trạng thái</span>
                        </button>
                        <ul class="user-dropdown custom-select-menu hidden" id="status-dropdown" style="min-width: 140px;">
                            <li>
                                <button class="udrop-item udrop-info" onclick="app.setSeriesStatus('collecting')" style="white-space: nowrap; border-left: 4px solid #3b82f6; border-radius: 0 6px 6px 0; margin-bottom: 2px;">
                                    <span style="font-weight: 500;">On-going</span>
                                </button>
                            </li>
                            <li>
                                <button class="udrop-item udrop-success" onclick="app.setSeriesStatus('completed')" style="white-space: nowrap; border-left: 4px solid #10b981; border-radius: 0 6px 6px 0; margin-bottom: 2px;">
                                    <span style="font-weight: 500;">Completed</span>
                                </button>
                            </li>
                            <li>
                                <button class="udrop-item udrop-danger" onclick="app.setSeriesStatus('dropped')" style="white-space: nowrap; border-left: 4px solid #ef4444; border-radius: 0 6px 6px 0;">
                                    <span style="font-weight: 500;">Dropped</span>
                                </button>
                            </li>
                        </ul>
                    </div>
                    <button class="custom-select-btn" id="btn-edit-target" title="Sửa mục tiêu cá nhân"
                        style="display: flex;">
                        <i data-feather="target" style="color:var(--text-muted); width: 16px; height: 16px;"></i>
                        <span style="font-size:0.85rem; font-weight: 500;">Mục tiêu</span>
                    </button>
                    <button class="btn btn-icon" onclick="app.toggleDetailViewMode()" id="btn-detail-view-mode"
                        title="Đổi chế độ hiển thị"
                        style="display: flex; align-items: center; justify-content: center; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm); border-radius: 99px; width: 32px; height: 32px; min-width: unset; padding: 0; flex-shrink: 0; color: var(--text-muted);">
                        <i data-feather="list" id="icon-detail-view-mode" style="width: 16px; height: 16px;"></i>
                    </button>
                </div>
            </div>
            <div class="volumes-list" id="volumes-list">
                <!-- Volumes will be listed here -->
            </div>
            <div id="series-detail-pagination"
                style="display:flex; justify-content:center; align-items:center; gap:1rem; margin-top:1.5rem; padding-bottom: 2rem;">
            </div>
        </section>
